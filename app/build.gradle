plugins {
    id 'com.android.application'
}

// Release signing comes from the environment so the keystore never lives in the repo.
def releaseStore = System.getenv('SCREENLINGO_KEYSTORE')

android {
    namespace 'com.hafij.screenlingo'
    compileSdk 35

    defaultConfig {
        applicationId 'com.hafij.screenlingo'
        minSdk 29
        targetSdk 35
        versionCode 4
        versionName '0.1.3'
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    signingConfigs {
        release {
            if (releaseStore) {
                storeFile file(releaseStore)
                storePassword System.getenv('SCREENLINGO_KEYSTORE_PASSWORD')
                keyAlias System.getenv('SCREENLINGO_KEY_ALIAS')
                keyPassword System.getenv('SCREENLINGO_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseStore) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
    implementation 'com.google.mlkit:text-recognition-devanagari:16.0.1'
    implementation 'com.google.mlkit:text-recognition-japanese:16.0.1'
    implementation 'com.google.mlkit:text-recognition-korean:16.0.1'
    implementation 'com.google.mlkit:translate:17.0.3'
    implementation 'com.google.mlkit:language-id:17.0.6'
}
